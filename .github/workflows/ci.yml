name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, Lint, Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npm run typecheck

      - name: Code Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDummyKeyForBuildValidation12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "subzero-demo.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "subzero-demo"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "subzero-demo.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:abcdef123456"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Dependency Security Audit
        # Known transitive vulnerabilities exist in upstream dependencies.
        # Tracked as an observed security signal rather than a release blocker pending scheduled dependency overhaul.
        run: npm audit --audit-level=critical
        continue-on-error: true
